<div [formGroup]="salaForm" class="modal-wrapper">

  <div class="modal-header">
    <div>
      <h5 class="titulo-modal-registro">Registrar Sala</h5>
      <p class="subtitulo-registro">Ingrese la información de la sala para el registro.</p>
    </div>
    <button (click)="cancelar()" class="btn-close">
      ✕
    </button>
  </div>

  <div class="modal-body">

    <div class="form-group">
      <label class="form-label">
        Nombre de la Sala
      </label>
      <input type="text" 
             formControlName="nombre_sala"
             placeholder="Ej: Sala de Computación"
             class="form-control" />
      <div class="error-message" *ngIf="nombre_sala?.touched && nombre_sala?.hasError('required')">
        El nombre de la sala es requerido
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        Tipo de Sala
      </label>
      <select formControlName="tipo_sala" class="form-select">
        <option value="" disabled selected>Seleccione tipo de sala</option>
        <option value="Full-time">Laboratorio</option>
        <option value="Part-time">Sala</option>
      </select>
      <div class="error-message" *ngIf="tipo_sala?.touched && tipo_sala?.hasError('required')">
        El tipo de sala es requerido
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        Capacidad
      </label>
      <input type="number" 
             formControlName="capacidad"
             placeholder="Ej: 30"
             class="form-control" />
      <div class="error-message" *ngIf="capacidad?.touched && capacidad?.hasError('required')">
        La capacidad es requerida
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button (click)="cancelar()" class="btn-secondary">
      Cancelar
    </button>
    <button (click)="guardar()" class="btn-primary">
      Registrar
    </button>
  </div>

</div>
