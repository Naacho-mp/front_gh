<div [formGroup]="seccionForm" class="modal-wrapper">

  <div class="modal-header">
    <div>
      <h5 class="titulo-modal-registro">Registrar Sección</h5>
      <p class="subtitulo-registro">Ingrese la información de la sección para el registro.</p>
    </div>
    <button (click)="cancelar()" class="btn-close">
      ✕
    </button>
  </div>

  <div class="modal-body">

    <div class="form-group">
      <label class="form-label">
        Código del Ramo
      </label>
      <input type="text" 
             formControlName="codigo_ramo"
             placeholder="Ej: CS-101"
             class="form-control" />
      <div class="error-message" *ngIf="codigo_ramo?.touched && codigo_ramo?.hasError('required')">
        El código del ramo es requerido
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        Número de Sección
      </label>
      <input type="text" 
             formControlName="numero_seccion"
             placeholder="Ej: 01"
             class="form-control" />
      <div class="error-message" *ngIf="numero_seccion?.touched && numero_seccion?.hasError('required')">
        El número de sección es requerido
      </div>
    </div>
  
    <div class="form-group">
      <label class="form-label">
        Estudiantes Inscritos
      </label>
      <input type="text" 
             formControlName="estudiantes_inscritos"
             placeholder="Ej: 30"
             class="form-control" />
      <div class="error-message" *ngIf="estudiantes_inscritos?.touched && estudiantes_inscritos?.hasError('required')">
        Los estudiantes inscritos son requeridos
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button (click)="cancelar()" class="btn-secondary">
      Cancelar
    </button>
    <button (click)="guardar()" class="btn-primary">
      Registrar
    </button>
  </div>

</div>
