
<div [formGroup]="ramoForm" class="modal-wrapper">

  <div class="modal-header">
    <div>
      <h5 class="titulo-modal-registro">Registrar Ramo</h5>
      <p class="subtitulo-registro">Ingrese la información del ramo para el registro.</p>
    </div>
    <button (click)="cancelar()" class="btn-close">
      ✕
    </button>
  </div>

  <div class="modal-body">

    <div class="form-group">
      <label class="form-label">Nombre del Ramo</label>
      <input type="text" 
             formControlName="nombre_ramo"
             placeholder="Ej: Matemáticas"
             class="form-control" />
      <div class="error-message" *ngIf="nombre_ramo?.touched && nombre_ramo?.hasError('required')">
        El nombre del ramo es requerido
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Nivel</label>
      <select formControlName="nivel" class="form-select">
        <option value="" disabled selected>Seleccione el nivel</option>
        <option value="I">Nivel I</option>
        <option value="II">Nivel II</option>
        <option value="III">Nivel III</option>
        <option value="IV">Nivel IV</option>
        <option value="V">Nivel V</option>
      </select>
      <div class="error-message" *ngIf="nivel?.touched && nivel?.hasError('required')">
        El nivel es requerido
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Cantidad de secciones</label>
      <input type="number" 
             formControlName="cantidad_secciones"
             placeholder="Ej: 3"
             class="form-control" />
      <div class="error-message" *ngIf="cantidad_secciones?.touched && cantidad_secciones?.hasError('required')">
        La cantidad de secciones es requerida
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Cupos por sección</label>
      <input type="number" 
             formControlName="cupos_seccion"
             placeholder="Ej: 30"
             class="form-control" />
      <div class="error-message" *ngIf="cupos_seccion?.touched && cupos_seccion?.hasError('required')">
        Los cupos por sección son requeridos
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Horas Cátedra</label>
      <input type="number" 
             formControlName="horas_catedra"
             placeholder="Ej: 4"
             class="form-control" />
      <div class="error-message" *ngIf="horas_catedra?.touched && horas_catedra?.hasError('required')">
        La cantidad de horas cátedra es requerida
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Horas Laboratorio</label>
      <input type="number" 
             formControlName="horas_laboratorio"
             placeholder="Ej: 4"
             class="form-control" />
      <div class="error-message" *ngIf="horas_laboratorio?.touched && horas_laboratorio?.hasError('required')">
        La cantidad de horas laboratorio es requerida
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button (click)="cancelar()" class="btn-secondary">
      Cancelar
    </button>
    <button (click)="guardar()" class="btn-primary">
      Registrar
    </button>
  </div>

</div>
